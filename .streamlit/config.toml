# Frontend theme for app.py. Fixed to a light pastel theme so widgets stay
# readable on the pastel background even when the browser prefers dark mode.
[theme]
base = "light"
primaryColor = "#2f7a6b"
backgroundColor = "#f6f6f2"
secondaryBackgroundColor = "#eef3f0"
textColor = "#2b3b37"
font = "sans serif"

[browser]
gatherUsageStats = false
